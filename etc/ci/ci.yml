name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: tidy
        run: bash etc/scripts/tidy.sh
      - name: test
        run: zig build test --summary all -Drequire-io-uring=true
      - name: test release-safe
        run: zig build test -Doptimize=ReleaseSafe
      - name: simulator swarm (fixed seeds)
        run: zig build sim -Doptimize=ReleaseSafe -- swarm 1 500

  swarm:
    # Longer swarm on every push to main: fresh seeds per run, reproducible from the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: swarm
        run: zig build sim -Doptimize=ReleaseSafe -- swarm $((GITHUB_RUN_NUMBER * 100000)) 20000

  fuzz:
    # Coverage-guided fuzz smoke: every std.testing.fuzz target for a bounded run count.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: fuzz
        run: zig build test --fuzz=200000 -Doptimize=ReleaseSafe
